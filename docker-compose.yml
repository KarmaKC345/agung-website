# Toko New Agung — jalankan semuanya dengan:  docker compose up -d --build
# Isi dulu file .env (salin dari .env.docker.example).
name: newagung

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newagung
      POSTGRES_DB: newagung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase:/supabase:ro
      - ./docker/db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newagung -d newagung"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://newagung:${POSTGRES_PASSWORD}@db:5432/newagung
      PORT: 4000
      CORS_ORIGINS: ${SITE_URL:-http://localhost:3000}
      # kosong → URL foto relatif (/uploads/...), diteruskan oleh web
      PUBLIC_API_URL: ""
      IMAGE_STORAGE: local
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      WEB_URL: http://web:3000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?isi REVALIDATE_SECRET di .env}
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
  uploads:
